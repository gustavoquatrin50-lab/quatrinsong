[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riffsync"
version = "0.3.1"
description = "Audio separation and transcription worker for RiffSync"
requires-python = ">=3.10,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["riffsync*"]
